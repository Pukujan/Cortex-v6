name: docs-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tracking and documentation traceability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          def refuse(message: str) -> None:
              print(f"REFUSE: {message}", file=sys.stderr)
              raise SystemExit(1)

          body = os.environ.get("PR_BODY") or ""
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          tracking = re.search(r"(?mi)^\s*Tracking:\s*#([0-9]+)\s*$", body)
          if tracking is None:
              refuse("PR body must contain an exact `Tracking: #<issue>` line")

          issue_number = int(tracking.group(1))
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/{issue_number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  issue = json.load(response)
          except urllib.error.HTTPError as exc:
              refuse(f"tracking issue #{issue_number} could not be resolved: HTTP {exc.code}")

          if "pull_request" in issue:
              refuse(f"#{issue_number} is a pull request, not a tracking issue")
          if issue.get("state") != "open":
              refuse(f"tracking issue #{issue_number} must still be open while the PR is under review")
          if not re.search(r"(?i)\bacceptance\b", issue.get("body") or ""):
              refuse(f"tracking issue #{issue_number} must contain acceptance criteria")

          docs_impact = re.search(r"(?mi)^\s*Docs-Impact:\s*(.+?)\s*$", body)
          if docs_impact is None:
              refuse("PR body must contain a `Docs-Impact:` line")
          docs_value = docs_impact.group(1).strip()

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
              text=True,
          ).splitlines()
          docs_changed = any(path == "README.md" or path.startswith("docs/") for path in changed)

          if docs_changed:
              if not docs_value.lower().startswith("updated"):
                  refuse("README/docs changed, so `Docs-Impact:` must start with `updated`")
          else:
              no_docs = re.fullmatch(r"(?i)none\s*-\s*(.+)", docs_value)
              if no_docs is None:
                  refuse("no durable docs changed; use `Docs-Impact: none - <specific reason>`")
              reason = no_docs.group(1).strip()
              if len(reason) < 12 or reason.lower() in {"not needed", "no impact", "n/a", "na"}:
                  refuse("the no-docs reason must be specific enough to review")

          print(f"tracking issue: #{issue_number} — {issue.get('title', '')}")
          print(f"changed files: {len(changed)}")
          print(f"durable docs changed: {docs_changed}")
          print("docs-gate: PASS")
          PY
